<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;}
  #stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
  /* 像素猫 */
  #cat{
    position:relative;
    width:160px;height:150px;
    image-rendering:pixelated;
    transition:transform .4s ease;
    cursor:pointer;
  }
  /* 用 CSS 画一只浅粉白色像素猫（body + ears + eyes + tail） */
  .body{
    position:absolute;left:25px;top:60px;width:110px;height:90px;
    background:#fff5f6;
    border:3px solid #f7d3da;
    border-radius:28px 28px 34px 34px;
    box-shadow:0 0 0 2px #f2b8c4 inset;
  }
  .head{
    position:absolute;left:40px;top:10px;width:80px;height:70px;
    background:#fff8f9;
    border:3px solid #f7d3da;
    border-radius:30px;
  }
  .ear{position:absolute;top:-4px;width:24px;height:30px;background:#f7c6d0;border:3px solid #f2b8c4;border-radius:6px 6px 0 0;}
  .ear.l{left:44px;transform:rotate(-8deg);}
  .ear.r{right:44px;transform:rotate(8deg);}
  .eye{position:absolute;top:34px;width:8px;height:10px;background:#3a2f33;border-radius:50%;}
  .eye.l{left:58px;}
  .eye.r{left:94px;}
  .muzzle{position:absolute;top:46px;left:70px;width:20px;height:10px;background:#ffe9ec;border-radius:6px;}
  .mouth{position:absolute;top:48px;left:78px;width:4px;height:6px;background:#d98a99;border-radius:0 0 4px 4px;}
  .tail{
    position:absolute;right:-18px;top:70px;width:34px;height:12px;
    background:#f7c6d0;border:3px solid #f2b8c4;border-radius:10px;
    transform-origin:left center;
    animation:tail 2.4s ease-in-out infinite;
  }
  @keyframes tail{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(28deg);}}
  /* 表情气泡 */
  #bubble{
    position:absolute;left:50%;top:-6px;transform:translateX(-50%);
    background:#fff;border:2px solid #f2b8c4;border-radius:14px;
    padding:4px 10px;font:12px/1.2 system-ui,sans-serif;color:#d97a8b;
    white-space:nowrap;opacity:0;transition:opacity .3s;
  }
  #bubble.show{opacity:1;}
  /* 动画状态 */
  #cat.idle .body{animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  #cat.happy .eye{height:3px;border-radius:2px;}
  #cat.pout .mouth{width:8px;height:4px;}
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div id="cat" class="idle" ontouchstart="petEngine.onTap()">
    <div class="head">
      <div class="ear l"></div><div class="ear r"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="muzzle"></div><div class="mouth"></div>
    </div>
    <div class="body"></div>
    <div class="tail"></div>
  </div>
</div>
<script>
const cat=document.getElementById('cat');
const bubble=document.getElementById('bubble');
const engine={
  state:{mood:'happy',whisper:'',gesture_reaction:''},
  onTap(){
    const s=this.state;
    cat.classList.remove('idle','happy','pout');
    const mood=s.mood||'happy';
    cat.classList.add(mood);
    // 气泡显示
    let txt = s.whisper || '喵~';
    bubble.textContent = txt;
    bubble.classList.add('show');
    setTimeout(()=>bubble.classList.remove('show'), 2600);
    // 反馈给 Android
    if(window.AndroidPet && s.gesture_reaction){
      AndroidPet.onGesture('tap_reaction');
    }
  },
  onDoubleTap(){
    cat.classList.add('happy');
    bubble.textContent = '哥哥在看着你哦 ~';
    bubble.classList.add('show');
    setTimeout(()=>bubble.classList.remove('show'), 2600);
  },
  setState(mood,whisper,gesture_reaction){
    this.state={mood:mood,whisper:whisper,gesture_reaction:gesture_reaction};
    cat.className = mood || 'idle';
  }
};
// 全局 API，供 Android evaluateJavascript 调用
window.petEngine = engine;
window.setPetState = function(mood, whisper){
  engine.setState(mood, whisper, '');
};
</script>
</body>
</html>
